# 保险理赔 Agent —— Nginx 反向代理（放在 http{} 块内，或 /etc/nginx/conf.d/claim-agent.conf）
# 作用：HTTPS + 域名 + 大文件上传（定损照片 base64）+ 静态加速
# 前置：在 8000 端口已运行 uvicorn（详见 DEPLOYMENT.md）

server {
    listen 80;
    server_name claim.your-domain.com;   # 改成你的域名

    # 上传定损照片（base64 在 JSON body 里），放宽到 25M
    client_max_body_size 25m;

    # 证书（certbot 申请后启用下面两行，并删掉 listen 80 改用 443）
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/claim.your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/claim.your-domain.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # 模型推理可能较慢
        proxy_connect_timeout 10s;
    }
}
